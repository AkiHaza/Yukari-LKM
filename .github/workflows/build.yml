name: build

on:
  workflow_dispatch:
    inputs:
      kernel_manifest_url:
        description: Kernel manifest URL (Android 14/GKI 6.1 by default)
        required: false
        default: ''
        type: string
      kernel_manifest_ref:
        description: Manifest branch or tag (common-android14-6.1 by default)
        required: false
        default: ''
        type: string
      kernel_build_label:
        description: Bazel kernel_build label for the selected manifest
        required: false
        default: ''
        type: string
      kernel_headers_label:
        description: Bazel all_headers label for the selected manifest
        required: false
        default: ''
        type: string
      ndk_version:
        description: Android SDK NDK version (26.3.11579264 by default)
        required: false
        default: ''
        type: string
      magisk_zygisk_url:
        description: Raw URL for the pinned Magisk zygisk.hpp header
        required: false
        default: ''
        type: string
      magisk_zygisk_sha256:
        description: Optional SHA-256 for zygisk.hpp (64 hex characters)
        required: false
        default: ''
        type: string
      abis:
        description: Comma-separated Android ABIs (arm64-v8a by default)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # Dispatch values override repository Variables. Empty values are filled
      # by the preparation step with reproducible Android 14/GKI 6.1 defaults.
      KERNEL_MANIFEST_URL: ${{ inputs.kernel_manifest_url || vars.YUKARI_KERNEL_MANIFEST_URL || '' }}
      KERNEL_MANIFEST_REF: ${{ inputs.kernel_manifest_ref || vars.YUKARI_KERNEL_MANIFEST_REF || '' }}
      KERNEL_BUILD_LABEL: ${{ inputs.kernel_build_label || vars.YUKARI_KERNEL_BUILD_LABEL || '' }}
      KERNEL_HEADERS_LABEL: ${{ inputs.kernel_headers_label || vars.YUKARI_KERNEL_HEADERS_LABEL || '' }}
      NDK_VERSION: ${{ inputs.ndk_version || vars.YUKARI_NDK_VERSION || '' }}
      MAGISK_ZYGISK_URL: ${{ inputs.magisk_zygisk_url || vars.YUKARI_MAGISK_ZYGISK_URL || '' }}
      MAGISK_ZYGISK_SHA256: ${{ inputs.magisk_zygisk_sha256 || vars.YUKARI_MAGISK_ZYGISK_SHA256 || '' }}
      ABIS: ${{ inputs.abis || vars.YUKARI_ABIS || '' }}
    steps:
      - name: Checkout Yukari-LKM
        uses: actions/checkout@v4

      - name: Install host build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl device-tree-compiler dwarves \
            flex git kmod libelf-dev libncurses-dev libssl-dev lld clang llvm \
            python3 rsync unzip zip
          # Remove unused preinstalled SDK images so the kernel checkout has
          # room on the standard GitHub-hosted runner disk.
          if [ -n "${ANDROID_HOME:-}" ]; then
            sudo rm -rf "$ANDROID_HOME/system-images" || true
          fi
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          set -Eeuo pipefail
          ndk_version="${NDK_VERSION:-26.3.11579264}"
          case "$ndk_version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid NDK version: $ndk_version" >&2; exit 2 ;;
          esac
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;$ndk_version"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [ -n "$sdk_root" ] || { echo "Android SDK root was not set" >&2; exit 2; }
          ndk_home="$sdk_root/ndk/$ndk_version"
          [ -x "$ndk_home/ndk-build" ] || { echo "ndk-build missing: $ndk_home/ndk-build" >&2; exit 2; }
          {
            printf 'ANDROID_SDK_ROOT=%s\n' "$sdk_root"
            printf 'ANDROID_NDK_HOME=%s\n' "$ndk_home"
            printf 'NDK_VERSION=%s\n' "$ndk_version"
          } >> "$GITHUB_ENV"

      - name: Install Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Prepare kernel Kleaf workspace
        shell: bash
        run: |
          set -Eeuo pipefail

          fail() {
            echo "Kernel preparation: $*" >&2
            exit 2
          }

          manifest_url="${KERNEL_MANIFEST_URL:-https://android.googlesource.com/kernel/manifest}"
          manifest_ref="${KERNEL_MANIFEST_REF:-common-android14-6.1}"
          kernel_build_label="${KERNEL_BUILD_LABEL:-//common:kernel_aarch64}"
          kernel_headers_label="${KERNEL_HEADERS_LABEL:-//common:all_headers}"

          case "$manifest_url" in
            *$'\n'*|*$'\r'*|*' '*) fail "KERNEL_MANIFEST_URL contains whitespace" ;;
            https://*) ;;
            *) fail "KERNEL_MANIFEST_URL must use HTTPS: $manifest_url" ;;
          esac
          case "$manifest_ref" in
            *$'\n'*|*$'\r'*|*[!A-Za-z0-9._/-]*) fail "Invalid KERNEL_MANIFEST_REF: $manifest_ref" ;;
          esac
          case "$kernel_build_label" in
            //[A-Za-z0-9_./:-]*) ;;
            *) fail "Invalid KERNEL_BUILD_LABEL: $kernel_build_label" ;;
          esac
          case "$kernel_headers_label" in
            //[A-Za-z0-9_./:-]*) ;;
            *) fail "Invalid KERNEL_HEADERS_LABEL: $kernel_headers_label" ;;
          esac
          invalid_build=$(printf '%s' "$kernel_build_label" | tr -d 'A-Za-z0-9_./:-')
          invalid_headers=$(printf '%s' "$kernel_headers_label" | tr -d 'A-Za-z0-9_./:-')
          [ -z "$invalid_build" ] || fail "KERNEL_BUILD_LABEL contains unsupported characters"
          [ -z "$invalid_headers" ] || fail "KERNEL_HEADERS_LABEL contains unsupported characters"

          workspace="$RUNNER_TEMP/android-kernel-workspace"
          rm -rf "$workspace"
          mkdir -p "$workspace"
          repo_bin="$RUNNER_TEMP/repo"
          curl --fail --location --retry 3 --retry-all-errors \
            https://storage.googleapis.com/git-repo-downloads/repo -o "$repo_bin"
          chmod 0755 "$repo_bin"
          (
            cd "$workspace"
            "$repo_bin" init --depth=1 \
              -u "$manifest_url" -b "$manifest_ref" -q
            "$repo_bin" sync -c --no-tags --optimized-fetch \
              --prune --force-sync -j"$(nproc)"
          )

          [ -f "$workspace/MODULE.bazel" ] ||
            [ -f "$workspace/WORKSPACE" ] ||
            [ -f "$workspace/WORKSPACE.bazel" ] ||
            [ -f "$workspace/bazel.WORKSPACE" ] ||
            fail "Manifest did not produce a Kleaf workspace marker"
          [ -x "$workspace/tools/bazel" ] || command -v bazel >/dev/null 2>&1 ||
            fail "No workspace tools/bazel or Bazelisk executable was found"

          {
            printf 'KERNEL_WORKSPACE=%s\n' "$workspace"
            printf 'KERNEL_MANIFEST_URL=%s\n' "$manifest_url"
            printf 'KERNEL_MANIFEST_REF=%s\n' "$manifest_ref"
            printf 'KERNEL_BUILD_LABEL=%s\n' "$kernel_build_label"
            printf 'KERNEL_HEADERS_LABEL=%s\n' "$kernel_headers_label"
          } >> "$GITHUB_ENV"
          echo "Kernel workspace prepared at $workspace"
          df -h "$workspace"

      - name: Fetch Magisk Zygisk header
        shell: bash
        run: |
          set -Eeuo pipefail
          header_url="${MAGISK_ZYGISK_URL:-https://raw.githubusercontent.com/topjohnwu/Magisk/v28.1/native/src/core/zygisk/zygisk.hpp}"
          case "$header_url" in
            *$'\n'*|*$'\r'*|*' '*) echo "MAGISK_ZYGISK_URL contains whitespace" >&2; exit 2 ;;
            https://*) ;;
            *) echo "MAGISK_ZYGISK_URL must use HTTPS: $header_url" >&2; exit 2 ;;
          esac
          if [ -n "${MAGISK_ZYGISK_SHA256:-}" ] &&
             [[ ! "$MAGISK_ZYGISK_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]]; then
            echo "MAGISK_ZYGISK_SHA256 must contain 64 hexadecimal characters" >&2
            exit 2
          fi
          magisk_include="$RUNNER_TEMP/magisk/include"
          mkdir -p "$magisk_include"
          curl --fail --location --retry 3 --retry-all-errors \
            "$header_url" -o "$magisk_include/zygisk.hpp"
          [ -s "$magisk_include/zygisk.hpp" ] || { echo "Downloaded zygisk.hpp is empty" >&2; exit 2; }
          if [ -n "${MAGISK_ZYGISK_SHA256:-}" ]; then
            printf '%s  %s\n' "$MAGISK_ZYGISK_SHA256" "$magisk_include/zygisk.hpp" | sha256sum -c -
          fi
          {
            printf 'MAGISK_INCLUDE=%s\n' "$magisk_include"
            printf 'MAGISK_ZYGISK_URL=%s\n' "$header_url"
          } >> "$GITHUB_ENV"

      - name: Validate cloud build inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          workspace="$KERNEL_WORKSPACE"
          bazel="$workspace/tools/bazel"
          if [ ! -x "$bazel" ]; then bazel="$(command -v bazel)"; fi
          [ -x "$ANDROID_NDK_HOME/ndk-build" ] || { echo "ndk-build missing" >&2; exit 2; }
          [ -s "$MAGISK_INCLUDE/zygisk.hpp" ] || { echo "zygisk.hpp missing" >&2; exit 2; }
          abis="${ABIS:-arm64-v8a}"
          case "$abis" in
            ''|*$'\n'*|*$'\r'*|*[!A-Za-z0-9_,.-]*)
              echo "ABIS must be a comma-separated ABI list" >&2
              exit 2
              ;;
          esac
          "$bazel" --output_user_root="$RUNNER_TEMP/bazel" query \
            "$KERNEL_BUILD_LABEL" >/dev/null
          "$bazel" --output_user_root="$RUNNER_TEMP/bazel" query \
            "$KERNEL_HEADERS_LABEL" >/dev/null
          printf 'BAZEL=%s\n' "$bazel" >> "$GITHUB_ENV"
          printf 'BAZEL_OUTPUT_USER_ROOT=%s\n' "$RUNNER_TEMP/bazel" >> "$GITHUB_ENV"
          printf 'ABIS=%s\n' "$abis" >> "$GITHUB_ENV"
          echo "Cloud build inputs validated"

      - name: Build Yukari module
        shell: bash
        run: ./build/build.sh

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: yukari-service-filter
          path: out/yukari-service-filter.zip
          if-no-files-found: error
