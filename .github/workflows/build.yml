name: build

on:
  workflow_dispatch:
    inputs:
      kernel_workspace:
        description: >-
          Optional override for the Android 14/GKI 6.1 Kleaf workspace. Uses
          YUKARI_KERNEL_WORKSPACE when empty.
        required: false
        default: ''
        type: string
      kernel_build_label:
        description: >-
          Optional override for the device kernel_build label. Uses
          YUKARI_KERNEL_BUILD_LABEL when empty.
        required: false
        default: ''
        type: string
      kernel_headers_label:
        description: >-
          Optional all_headers label override. Defaults to //common:all_headers.
        required: false
        default: ''
        type: string
      ndk:
        description: >-
          Optional Android NDK directory override. Uses YUKARI_ANDROID_NDK_HOME
          when empty.
        required: false
        default: ''
        type: string
      magisk_include:
        description: >-
          Optional Magisk include directory override. Uses YUKARI_MAGISK_INCLUDE
          when empty.
        required: false
        default: ''
        type: string
      bazel:
        description: >-
          Optional Bazel/Kleaf wrapper override. Empty selects workspace tools/bazel
          and then PATH.
        required: false
        default: ''
        type: string
      abis:
        description: Optional comma-separated Android ABIs. Defaults to arm64-v8a.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    # This label is intentional: the runner must have the matching Kleaf/DDK
    # workspace, Android NDK, and Magisk headers preinstalled.
    runs-on: [self-hosted, linux, android-ddk]
    timeout-minutes: 120
    env:
      # Inputs override repository variables. Empty values are resolved in the
      # preflight step, which can also use environment variables on the runner.
      KERNEL_WORKSPACE: ${{ inputs.kernel_workspace || vars.YUKARI_KERNEL_WORKSPACE || '' }}
      KERNEL_BUILD_LABEL: ${{ inputs.kernel_build_label || vars.YUKARI_KERNEL_BUILD_LABEL || '' }}
      KERNEL_HEADERS_LABEL: ${{ inputs.kernel_headers_label || vars.YUKARI_KERNEL_HEADERS_LABEL || '' }}
      ANDROID_NDK_HOME: ${{ inputs.ndk || vars.YUKARI_ANDROID_NDK_HOME || '' }}
      MAGISK_INCLUDE: ${{ inputs.magisk_include || vars.YUKARI_MAGISK_INCLUDE || '' }}
      BAZEL: ${{ inputs.bazel || vars.YUKARI_BAZEL || '' }}
      ABIS: ${{ inputs.abis || vars.YUKARI_ABIS || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate build inputs
        shell: bash
        run: |
          set -Eeuo pipefail

          fail() {
            echo "CI preflight: $*" >&2
            exit 2
          }

          # The runner environment is the third configuration source. This is
          # useful when the same self-hosted runner serves several repositories.
          first_non_empty() {
            if [ -n "${1:-}" ]; then
              printf '%s' "$1"
            else
              printf '%s' "${2:-}"
            fi
          }

          kernel_workspace=$(first_non_empty "${KERNEL_WORKSPACE:-}" "${YUKARI_KERNEL_WORKSPACE:-}")
          kernel_build_label=$(first_non_empty "${KERNEL_BUILD_LABEL:-}" "${YUKARI_KERNEL_BUILD_LABEL:-}")
          kernel_headers_label=$(first_non_empty "${KERNEL_HEADERS_LABEL:-}" "${YUKARI_KERNEL_HEADERS_LABEL:-//common:all_headers}")
          ndk=$(first_non_empty "${ANDROID_NDK_HOME:-}" "${YUKARI_ANDROID_NDK_HOME:-}")
          magisk_include=$(first_non_empty "${MAGISK_INCLUDE:-}" "${YUKARI_MAGISK_INCLUDE:-}")
          bazel=$(first_non_empty "${BAZEL:-}" "${YUKARI_BAZEL:-}")
          abis=$(first_non_empty "${ABIS:-}" "${YUKARI_ABIS:-arm64-v8a}")

          for value in "$kernel_workspace" "$kernel_build_label" "$kernel_headers_label" \
            "$ndk" "$magisk_include" "$bazel" "$abis"; do
            case "$value" in
              *$'\n'*|*$'\r'*) fail "CI input contains a newline; refusing to write it to GITHUB_ENV" ;;
            esac
          done

          validate_label() {
            local name=$1
            local value=$2
            [[ "$value" =~ ^//[A-Za-z0-9_./:-]+$ ]] || \
              fail "$name must contain only Bazel label characters and begin with //: $value"
          }

          [ -n "$kernel_workspace" ] || fail "KERNEL_WORKSPACE is unset; configure vars.YUKARI_KERNEL_WORKSPACE or runner env YUKARI_KERNEL_WORKSPACE"
          case "$kernel_workspace" in
            /*) ;;
            *) fail "KERNEL_WORKSPACE must be an absolute Linux path: $kernel_workspace" ;;
          esac
          [ -d "$kernel_workspace" ] || fail "KERNEL_WORKSPACE does not exist: $kernel_workspace"
          if [ ! -f "$kernel_workspace/MODULE.bazel" ] &&
             [ ! -f "$kernel_workspace/WORKSPACE" ] &&
             [ ! -f "$kernel_workspace/WORKSPACE.bazel" ] &&
             [ ! -f "$kernel_workspace/bazel.WORKSPACE" ]; then
            fail "KERNEL_WORKSPACE is not a Kleaf workspace (no MODULE.bazel/WORKSPACE marker): $kernel_workspace"
          fi

          [ -n "$kernel_build_label" ] || fail "KERNEL_BUILD_LABEL is unset; configure the exact device kernel_build label"
          validate_label KERNEL_BUILD_LABEL "$kernel_build_label"
          validate_label KERNEL_HEADERS_LABEL "$kernel_headers_label"

          [ -n "$ndk" ] || fail "ANDROID_NDK_HOME is unset; configure vars.YUKARI_ANDROID_NDK_HOME or runner env YUKARI_ANDROID_NDK_HOME"
          case "$ndk" in
            /*) ;;
            *) fail "ANDROID_NDK_HOME must be an absolute Linux path: $ndk" ;;
          esac
          [ -x "$ndk/ndk-build" ] || fail "ndk-build is missing or not executable: $ndk/ndk-build"

          [ -n "$magisk_include" ] || fail "MAGISK_INCLUDE is unset; configure vars.YUKARI_MAGISK_INCLUDE or runner env YUKARI_MAGISK_INCLUDE"
          case "$magisk_include" in
            /*) ;;
            *) fail "MAGISK_INCLUDE must be an absolute Linux path: $magisk_include" ;;
          esac
          [ -s "$magisk_include/zygisk.hpp" ] || fail "Magisk zygisk.hpp is missing or empty: $magisk_include/zygisk.hpp"

          if [ -n "$bazel" ]; then
            case "$bazel" in
              */*) [ -x "$bazel" ] || fail "BAZEL is not executable: $bazel" ;;
              *) command -v "$bazel" >/dev/null 2>&1 || fail "BAZEL is not on PATH: $bazel" ;;
            esac
          elif [ -x "$kernel_workspace/tools/bazel" ]; then
            bazel="$kernel_workspace/tools/bazel"
          else
            bazel=$(command -v bazel || true)
            [ -n "$bazel" ] || fail "No Bazel wrapper found; set YUKARI_BAZEL or provide KERNEL_WORKSPACE/tools/bazel"
          fi

          [ -n "$abis" ] || fail "ABIS must contain at least one Android ABI"

          # Pass the resolved values to the build step and make the selected
          # configuration visible in the log for reproducibility.
          {
            printf 'KERNEL_WORKSPACE=%s\n' "$kernel_workspace"
            printf 'KERNEL_BUILD_LABEL=%s\n' "$kernel_build_label"
            printf 'KERNEL_HEADERS_LABEL=%s\n' "$kernel_headers_label"
            printf 'ANDROID_NDK_HOME=%s\n' "$ndk"
            printf 'MAGISK_INCLUDE=%s\n' "$magisk_include"
            printf 'BAZEL=%s\n' "$bazel"
            printf 'ABIS=%s\n' "$abis"
          } >> "$GITHUB_ENV"

          echo "CI preflight: Android 14 / GKI 6.1 inputs validated"
          echo "CI preflight: kernel label=$kernel_build_label headers=$kernel_headers_label abis=$abis"

      - name: Build Yukari module
        shell: bash
        run: ./build/build.sh

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: yukari-service-filter
          path: out/yukari-service-filter.zip
          if-no-files-found: error
